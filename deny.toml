[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "x86_64-linux-android",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# These informational, unmaintained notices all enter through
# tauri-utils -> urlpattern in the exact Tauri 2.11.x graph. They have no safe
# compatible upgrade at this pin. Keep them exact and remove them when Tauri
# replaces urlpattern; vulnerability and unsoundness advisories remain denied.
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "transitive urlpattern dependency in pinned Tauri 2.11.x; informational unmaintained notice with no compatible upgrade" },
  { id = "RUSTSEC-2025-0080", reason = "transitive urlpattern dependency in pinned Tauri 2.11.x; informational unmaintained notice with no compatible upgrade" },
  { id = "RUSTSEC-2025-0081", reason = "transitive urlpattern dependency in pinned Tauri 2.11.x; informational unmaintained notice with no compatible upgrade" },
  { id = "RUSTSEC-2025-0098", reason = "transitive urlpattern dependency in pinned Tauri 2.11.x; informational unmaintained notice with no compatible upgrade" },
  { id = "RUSTSEC-2025-0100", reason = "transitive urlpattern dependency in pinned Tauri 2.11.x; informational unmaintained notice with no compatible upgrade" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
