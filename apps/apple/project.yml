name: Lorepia
options:
  bundleIdPrefix: dev.lorepia
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: 2.44.0
packages:
  LorepiaKit:
    path: Packages/LorepiaKit
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 6.0
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  LorepiaIOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
    dependencies:
      - package: LorepiaKit
        product: LorepiaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lorepia.ios
        PRODUCT_NAME: LorePia
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: LorePia
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
  LorepiaMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
    dependencies:
      - package: LorepiaKit
        product: LorepiaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lorepia.mac
        PRODUCT_NAME: LorePia
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: LorePia
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/LorepiaMac.entitlements
        ENABLE_HARDENED_RUNTIME: true
schemes:
  LorepiaIOS:
    build:
      targets:
        LorepiaIOS: all
    run:
      config: Debug
    test:
      config: Debug
  LorepiaMac:
    build:
      targets:
        LorepiaMac: all
    run:
      config: Debug
    test:
      config: Debug
