name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Filter Rust paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          required="$(./scripts/ci-path-filter.sh rust "$BASE_SHA" "$HEAD_SHA")"
          echo "required=$required" >> "$GITHUB_OUTPUT"

  rust_build:
    name: rust-build
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/lorepia/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri frontend dependencies
        working-directory: apps/lorepia
        run: npm ci --ignore-scripts
      - name: Check locked npm dependency licenses
        run: node scripts/check-npm-licenses.mjs
      - name: Build Tauri frontend
        working-directory: apps/lorepia
        run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test workspace
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked 2>&1 | tee cargo-test.log
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
      - name: Upload Rust failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: cargo-test.log
          if-no-files-found: ignore
          retention-days: 7

  rust:
    needs: [changes, rust_build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require relevant Rust build
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.required }}
          BUILD_RESULT: ${{ needs.rust_build.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          if [ "$BUILD_REQUIRED" = "true" ]; then
            test "$BUILD_RESULT" = "success"
          fi
