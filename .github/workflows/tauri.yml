name: tauri

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Filter Tauri paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          required="$(./scripts/ci-path-filter.sh tauri "$BASE_SHA" "$HEAD_SHA")"
          echo "required=$required" >> "$GITHUB_OUTPUT"

  frontend:
    name: tauri-frontend
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/lorepia/package-lock.json
      - name: Check locked frontend and build
        run: ./scripts/check-tauri.sh

  macos_smoke:
    name: tauri-macos-build-launch
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/lorepia/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Install locked npm graph without lifecycle scripts
        working-directory: apps/lorepia
        run: npm ci --ignore-scripts
      - name: Check locked npm dependency licenses
        run: node scripts/check-npm-licenses.mjs
      - name: Compile unsigned development desktop application
        working-directory: apps/lorepia
        run: >-
          npm run tauri --
          build
          --debug
          --no-bundle
          --ci
          --config src-tauri/tauri.dev.conf.json
          --config src-tauri/tauri.macos.dev.conf.json
      - name: Verify generated Tauri permission drift
        run: |
          git diff --exit-code -- apps/lorepia/src-tauri/permissions/autogenerated
          test -z "$(
            git ls-files \
              --others \
              --exclude-standard \
              -- apps/lorepia/src-tauri/permissions/autogenerated
          )"
      - name: Launch macOS process smoke
        run: |
          binary="$GITHUB_WORKSPACE/target/debug/lorepia"
          log="$RUNNER_TEMP/tauri-macos-smoke.log"
          test -x "$binary"
          "$binary" >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" >/dev/null 2>&1 || true
            wait "$pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in {1..10}; do
            sleep 1
            if ! kill -0 "$pid" >/dev/null 2>&1; then
              cat "$log"
              exit 1
            fi
          done
          echo "macOS Tauri process remained alive for 10 seconds"
      - name: Upload macOS launch log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tauri-macos-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  windows_smoke:
    name: tauri-windows-build-launch
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/lorepia/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Install locked npm graph without lifecycle scripts
        working-directory: apps/lorepia
        run: npm ci --ignore-scripts
      - name: Check locked npm dependency licenses
        run: node scripts/check-npm-licenses.mjs
      - name: Compile unsigned development desktop application
        working-directory: apps/lorepia
        run: >-
          npm run tauri --
          build
          --debug
          --no-bundle
          --ci
          --config src-tauri/tauri.dev.conf.json
          --config src-tauri/tauri.windows.dev.conf.json
      - name: Verify generated Tauri permission drift
        shell: pwsh
        run: |
          git diff --exit-code -- apps/lorepia/src-tauri/permissions/autogenerated
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $untracked = git ls-files `
            --others `
            --exclude-standard `
            -- apps/lorepia/src-tauri/permissions/autogenerated
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($untracked) {
            throw "Untracked generated Tauri permissions: $untracked"
          }
      - name: Launch Windows process smoke
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE "target\debug\lorepia.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "tauri-windows-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "tauri-windows-smoke.stderr.log"
          if (-not (Test-Path $binary -PathType Leaf)) {
            throw "Tauri executable was not found at $binary"
          }
          $process = Start-Process `
            -FilePath $binary `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          try {
            foreach ($attempt in 1..10) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) {
                Get-Content $stdout -ErrorAction SilentlyContinue
                Get-Content $stderr -ErrorAction SilentlyContinue
                throw "Windows Tauri process exited during launch smoke"
              }
            }
            Write-Output "Windows Tauri process remained alive for 10 seconds"
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Upload Windows launch logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tauri-windows-smoke.stdout.log
            ${{ runner.temp }}/tauri-windows-smoke.stderr.log
          if-no-files-found: ignore
          retention-days: 7

  android_smoke:
    name: tauri-android-build-install-launch
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android build and emulator packages
        run: |
          sdkmanager \
            "build-tools;36.0.0" \
            "emulator" \
            "ndk;29.0.14206865" \
            "platform-tools" \
            "platforms;android-36" \
            "system-images;android-36;google_apis;x86_64"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/lorepia/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install locked npm graph without lifecycle scripts
        working-directory: apps/lorepia
        run: npm ci --ignore-scripts
      - name: Check locked npm dependency licenses
        run: node scripts/check-npm-licenses.mjs
      - name: Build, install, and launch Android Tauri application
        working-directory: apps/lorepia
        run: |
          test -x src-tauri/gen/android/gradlew
          node "$GITHUB_WORKSPACE/scripts/normalize-tauri-android-generated.mjs" --check
          manifest_file="$GITHUB_WORKSPACE/plugins/lorepia-platform/android/src/main/AndroidManifest.xml"
          backup_rules="$GITHUB_WORKSPACE/plugins/lorepia-platform/android/src/main/res/xml/lorepia_backup_rules.xml"
          data_extraction_rules="$GITHUB_WORKSPACE/plugins/lorepia-platform/android/src/main/res/xml/lorepia_data_extraction_rules.xml"
          app_manifest="$GITHUB_WORKSPACE/apps/lorepia/src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          capture_paths="$GITHUB_WORKSPACE/apps/lorepia/src-tauri/gen/android/app/src/main/res/xml/file_paths.xml"
          test "$(grep -Ec 'android:allowBackup="false"' "$manifest_file")" -eq 1
          test "$(
            grep -Ec \
              'android:fullBackupContent="@xml/lorepia_backup_rules"' \
              "$manifest_file"
          )" -eq 1
          test "$(
            grep -Ec \
              'android:dataExtractionRules="@xml/lorepia_data_extraction_rules"' \
              "$manifest_file"
          )" -eq 1
          test -f "$backup_rules"
          test -f "$data_extraction_rules"
          cmp -s \
            "$backup_rules" \
            "$GITHUB_WORKSPACE/apps/android/app/src/main/res/xml/backup_rules.xml"
          cmp -s \
            "$data_extraction_rules" \
            "$GITHUB_WORKSPACE/apps/android/app/src/main/res/xml/data_extraction_rules.xml"
          test "$(grep -Ec '<include([[:space:]]|>)' "$backup_rules")" -eq 0
          test "$(grep -Ec '<exclude([[:space:]]|>)' "$backup_rules")" -eq 5
          test "$(grep -Ec 'path="\\."' "$backup_rules")" -eq 5
          test "$(grep -Ec 'path="' "$backup_rules")" -eq 5
          test "$(grep -Ec '<include([[:space:]]|>)' "$data_extraction_rules")" -eq 0
          test "$(grep -Ec '<exclude([[:space:]]|>)' "$data_extraction_rules")" -eq 18
          test "$(grep -Ec 'path="\\."' "$data_extraction_rules")" -eq 18
          test "$(grep -Ec 'path="' "$data_extraction_rules")" -eq 18
          test "$(grep -Ec 'androidx\\.core\\.content\\.FileProvider' "$app_manifest")" -eq 1
          test "$(grep -Ec 'android:exported="false"' "$app_manifest")" -eq 1
          test "$(grep -Ec 'android:grantUriPermissions="true"' "$app_manifest")" -eq 1
          test "$(grep -Ec '@xml/file_paths' "$app_manifest")" -eq 1
          test "$(grep -Ec '<external-files-path([[:space:]]|>)' "$capture_paths")" -eq 1
          test "$(grep -Ec 'name="tauri_capture_images"' "$capture_paths")" -eq 1
          test "$(grep -Ec 'path="Pictures/"' "$capture_paths")" -eq 1
          test "$(grep -Ec '<(external|cache|files|root)-path([[:space:]]|>)' "$capture_paths")" -eq 0
          for domain in root file database sharedpref external; do
            test "$(
              grep -Ec "domain=\"$domain\"" "$backup_rules"
            )" -eq 1
            test "$(
              grep -Ec "domain=\"$domain\"" "$data_extraction_rules"
            )" -eq 2
          done
          for domain in device_root device_file device_database device_sharedpref; do
            test "$(
              grep -Ec "domain=\"$domain\"" "$data_extraction_rules"
            )" -eq 2
          done
          printf '%s  %s\n' \
            e996d452d2645e70c01c11143ca2d3742734a28da2bf61f25c82bdc288c9e637 \
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.jar |
            sha256sum --check --strict
          wrapper_properties="src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties"
          grep -Fx \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip' \
            "$wrapper_properties"
          grep -Fx \
            'distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531' \
            "$wrapper_properties"
          grep -Fx 'networkTimeout=10000' "$wrapper_properties"
          grep -Fx 'validateDistributionUrl=true' "$wrapper_properties"
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export ANDROID_NDK_HOME="$NDK_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/lorepia-tauri-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd \
            --force \
            --name lorepia-tauri-ci \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
          emulator \
            -avd lorepia-tauri-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot-save \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            -wipe-data \
            >"$GITHUB_WORKSPACE/tauri-android-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            kill "$emulator_pid" >/dev/null 2>&1 || true
            wait "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          set -o pipefail
          npm run tauri -- \
            android build \
            --debug \
            --target x86_64 \
            --apk \
            --ci \
            --config src-tauri/tauri.dev.conf.json \
            --config src-tauri/tauri.android.dev.conf.json \
            2>&1 | tee "$GITHUB_WORKSPACE/tauri-android-build.log"

          timeout 180 adb wait-for-device
          booted=""
          for _ in {1..120}; do
            if ! kill -0 "$emulator_pid" >/dev/null 2>&1; then
              cat "$GITHUB_WORKSPACE/tauri-android-emulator.log"
              exit 1
            fi
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [[ "$booted" == "1" ]]; then
              break
            fi
            sleep 2
          done
          test "$booted" = "1"

          apk="src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -f "$apk"
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")"
          package_id="$(
            printf '%s\n' "$badging" |
              sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p"
          )"
          activity="$(
            printf '%s\n' "$badging" |
              sed -n "s/^launchable-activity: name='\\([^']*\\)'.*/\\1/p"
          )"
          manifest_tree="$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump xmltree "$apk" AndroidManifest.xml
          )"
          capture_paths_tree="$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump xmltree "$apk" res/xml/file_paths.xml
          )"
          test -n "$package_id"
          test -n "$activity"
          test "$package_id" = "dev.lorepia.app.dev"
          test "$(
            printf '%s\n' "$badging" |
              sed -n "s/^application-label:'\\([^']*\\)'.*/\\1/p" |
              head -n 1
          )" = "LorePia"
          test "$(
            printf '%s\n' "$badging" |
              sed -n "s/^package: .* versionCode='\\([^']*\\)'.*/\\1/p"
          )" = "2"
          test "$(
            printf '%s\n' "$manifest_tree" |
              grep -Ec \
                'A: android:allowBackup\([^)]*\)=\(type 0x12\)0x0$'
          )" -eq 1
          test "$(
            printf '%s\n' "$manifest_tree" |
              grep -Ec \
                'A: android:fullBackupContent\([^)]*\)=@0x[0-9a-fA-F]+$'
          )" -eq 1
          test "$(
            printf '%s\n' "$manifest_tree" |
              grep -Ec \
                'A: android:dataExtractionRules\([^)]*\)=@0x[0-9a-fA-F]+$'
          )" -eq 1
          test "$(
            printf '%s\n' "$manifest_tree" |
              grep -Ec 'A: android:name\([^)]*\)="androidx\.core\.content\.FileProvider"'
          )" -eq 1
          test "$(
            printf '%s\n' "$capture_paths_tree" |
              grep -Ec 'E: external-files-path'
          )" -eq 1
          test "$(
            printf '%s\n' "$capture_paths_tree" |
              grep -Ec 'A: name\([^)]*\)="tauri_capture_images"'
          )" -eq 1
          test "$(
            printf '%s\n' "$capture_paths_tree" |
              grep -Ec 'A: path\([^)]*\)="Pictures/"'
          )" -eq 1
          test "$(
            printf '%s\n' "$capture_paths_tree" |
              grep -Ec 'E: (external|cache|files|root)-path'
          )" -eq 0
          if printf '%s\n' "$manifest_tree" |
            grep -Eq \
              'android\.permission\.(READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|READ_MEDIA_AUDIO)'; then
            echo "Android package unexpectedly requests broad media or storage access" >&2
            exit 1
          fi

          adb install -r "$apk"
          adb logcat -c
          start_output="$(adb shell am start -W -n "$package_id/$activity")"
          printf '%s\n' "$start_output"
          printf '%s\n' "$start_output" | grep -F "Status: ok"
          for _ in {1..10}; do
            sleep 1
            process_id="$(adb shell pidof "$package_id" 2>/dev/null | tr -d '\r')"
            if [[ -z "$process_id" ]]; then
              adb logcat -d >"$GITHUB_WORKSPACE/tauri-android-logcat.log"
              cat "$GITHUB_WORKSPACE/tauri-android-logcat.log"
              exit 1
            fi
          done
          adb logcat -d >"$GITHUB_WORKSPACE/tauri-android-logcat.log"
          echo "Android Tauri process remained alive for 10 seconds"
      - name: Verify generated Android and Tauri permission drift
        run: |
          gradle_file="apps/lorepia/src-tauri/gen/android/app/build.gradle.kts"
          strings_file="apps/lorepia/src-tauri/gen/android/app/src/main/res/values/strings.xml"
          test "$(
            grep -Ec \
              '^[[:space:]]*applicationIdSuffix = "\.dev"$' \
              "$gradle_file"
          )" -eq 1
          test "$(
            grep -Ec \
              '^[[:space:]]*<string name="app_name">"LorePia"</string>$' \
              "$strings_file"
          )" -eq 1
          test "$(
            grep -Ec \
              '^[[:space:]]*<string name="main_activity_title">"LorePia"</string>$' \
              "$strings_file"
          )" -eq 1
          perl -ni -e \
            'print unless /^[ \t]*applicationIdSuffix = "\.dev"\r?\n\z/' \
            "$gradle_file"
          git diff --exit-code -- \
            apps/lorepia/src-tauri/gen/android \
            apps/lorepia/src-tauri/permissions/autogenerated
          test -z "$(
            git ls-files \
              --others \
              --exclude-standard \
              -- \
              apps/lorepia/src-tauri/gen/android \
              apps/lorepia/src-tauri/permissions/autogenerated
          )"
      - name: Upload Android build and launch logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tauri-android-build.log
            tauri-android-emulator.log
            tauri-android-logcat.log
          if-no-files-found: ignore
          retention-days: 7

  ios_smoke:
    name: tauri-ios-build-install-launch
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/lorepia/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Install locked npm graph without lifecycle scripts
        working-directory: apps/lorepia
        run: npm ci --ignore-scripts
      - name: Check locked npm dependency licenses
        run: node scripts/check-npm-licenses.mjs
      - name: Build, install, and launch iOS Tauri application
        working-directory: apps/lorepia
        run: |
          test -d src-tauri/gen/apple
          unset \
            APPLE_DEVELOPMENT_TEAM \
            IOS_CERTIFICATE \
            IOS_CERTIFICATE_PASSWORD \
            IOS_MOBILE_PROVISION
          set -o pipefail
          npm run tauri -- \
            ios build \
            --debug \
            --target aarch64-sim \
            --ci \
            --no-sign \
            --config src-tauri/tauri.dev.conf.json \
            --config src-tauri/tauri.ios.dev.conf.json \
            2>&1 | tee "$GITHUB_WORKSPACE/tauri-ios-build.log"

          ios_app="src-tauri/gen/apple/build/arm64-sim/LorePia Dev.app"
          test -d "$ios_app"
          test -f "$ios_app/Info.plist"
          bundle_id="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$ios_app/Info.plist"
          )"
          test -n "$bundle_id"
          test "$bundle_id" = "dev.lorepia.ios.dev"

          device_line="$(
            xcrun simctl list devices available |
              awk '
                /iPhone/ && /\(Booted\)/ {
                  print
                  found = 1
                  exit
                }
                /iPhone/ && /\(Shutdown\)/ && fallback == "" {
                  fallback = $0
                }
                END {
                  if (!found && fallback != "") {
                    print fallback
                  }
                }
              '
          )"
          simulator_id="$(
            printf '%s\n' "$device_line" |
              grep -Eo '[0-9A-Fa-f-]{36}' |
              head -n 1
          )"
          test -n "$simulator_id"
          cleanup() {
            xcrun simctl terminate "$simulator_id" "$bundle_id" >/dev/null 2>&1 || true
            xcrun simctl shutdown "$simulator_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$simulator_id" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" "$ios_app"
          launch_output="$(
            xcrun simctl launch \
              --terminate-running-process \
              "$simulator_id" \
              "$bundle_id"
          )"
          printf '%s\n' "$launch_output"
          process_id="$(
            printf '%s\n' "$launch_output" |
              sed -n 's/.*: \([0-9][0-9]*\)$/\1/p'
          )"
          test -n "$process_id"
          for _ in {1..10}; do
            sleep 1
            if ! xcrun simctl spawn \
              "$simulator_id" \
              launchctl procinfo "$process_id" \
              >"$GITHUB_WORKSPACE/tauri-ios-runtime.log" 2>&1; then
              xcrun simctl spawn "$simulator_id" log show \
                --style compact \
                --last 1m \
                --predicate "processIdentifier == $process_id" \
                >>"$GITHUB_WORKSPACE/tauri-ios-runtime.log" 2>&1 ||
                true
              cat "$GITHUB_WORKSPACE/tauri-ios-runtime.log"
              exit 1
            fi
          done
          echo "iOS Tauri process remained alive for 10 seconds"
      - name: Verify generated iOS and Tauri permission drift
        run: |
          project_file="$(
            git rev-parse --show-toplevel
          )/apps/lorepia/src-tauri/gen/apple/lorepia-tauri.xcodeproj/project.pbxproj"
          project_spec="apps/lorepia/src-tauri/gen/apple/project.yml"
          info_plist="apps/lorepia/src-tauri/gen/apple/lorepia-tauri_iOS/Info.plist"
          test -f "$project_file"
          test -f "$project_spec"
          test -f "$info_plist"
          test "$(
            grep -Ec \
              '^  bundleIdPrefix: dev\.lorepia\.ios$' \
              "$project_spec"
          )" -eq 1
          test "$(
            grep -Ec \
              '^      PRODUCT_NAME: LorePia$' \
              "$project_spec"
          )" -eq 1
          test "$(
            grep -Ec \
              '^      PRODUCT_BUNDLE_IDENTIFIER: dev\.lorepia\.ios$' \
              "$project_spec"
          )" -eq 1
          test "$(
            grep -Ec \
              '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = dev\.lorepia\.ios\.dev;$' \
              "$project_file"
          )" -eq 2
          test "$(
            grep -Ec \
              '^[[:space:]]*PRODUCT_NAME = "LorePia Dev";$' \
              "$project_file"
          )" -eq 2
          perl -pi -e \
            's/^(\s*)PRODUCT_BUNDLE_IDENTIFIER = dev\.lorepia\.ios\.dev;$/${1}PRODUCT_BUNDLE_IDENTIFIER = dev.lorepia.ios;/; s/^(\s*)PRODUCT_NAME = "LorePia Dev";$/${1}PRODUCT_NAME = LorePia;/' \
            "$project_file"
          test "$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$info_plist"
          )" = "2"
          test "$(tail -c 1 "$info_plist")" = ">"
          printf '\n' >>"$info_plist"
          git diff --exit-code -- \
            apps/lorepia/src-tauri/gen/apple \
            apps/lorepia/src-tauri/permissions/autogenerated
          test -z "$(
            git ls-files \
              --others \
              --exclude-standard \
              -- \
              apps/lorepia/src-tauri/gen/apple \
              apps/lorepia/src-tauri/permissions/autogenerated
          )"
      - name: Upload iOS build and launch logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-ios-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tauri-ios-build.log
            tauri-ios-runtime.log
          if-no-files-found: ignore
          retention-days: 7

  tauri:
    needs:
      [changes, frontend, macos_smoke, windows_smoke, android_smoke, ios_smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require relevant Tauri checks
        env:
          ANDROID_RESULT: ${{ needs.android_smoke.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          IOS_RESULT: ${{ needs.ios_smoke.result }}
          MACOS_RESULT: ${{ needs.macos_smoke.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          WINDOWS_RESULT: ${{ needs.windows_smoke.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          if [ "$REQUIRED" = "true" ]; then
            test "$FRONTEND_RESULT" = "success"
            test "$MACOS_RESULT" = "success"
            test "$WINDOWS_RESULT" = "success"
            test "$ANDROID_RESULT" = "success"
            test "$IOS_RESULT" = "success"
          fi
