name: Bug report
description: Report a reproducible non-security defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include credentials or private user data here.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, macOS, Windows, Shared Rust core]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use synthetic data and list exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or app version
    validations:
      required: true
